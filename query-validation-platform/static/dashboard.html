<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产能看板 · 产能验证平台</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<div id="layout"></div>
<div class="content">
  <div class="grid grid-4" id="metrics"></div>
  <div style="height:16px"></div>
  <div class="grid grid-2">
    <div class="card"><h2>审核队列积压</h2><div class="grid grid-2" id="queue"></div></div>
    <div class="card"><h2>失败类型 Top-5</h2><div id="errors"></div></div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
requireLogin();
renderLayout('dashboard', '产能看板');
async function load(){
  const r=await fetch('/api/dashboard/metrics');
  const d=await r.json();
  const fmtPct=x=>`${(x*100).toFixed(1)}%`;
  const fmtSec=x=>x>60?`${(x/60).toFixed(1)}min`:`${x.toFixed(1)}s`;
  document.getElementById('metrics').innerHTML=`
    <div class="stat"><div class="n">${d.throughput_per_hour}</div><div class="l">今日吞吐（条/时）</div></div>
    <div class="stat"><div class="n">${fmtPct(d.first_pass_rate_24h)}</div><div class="l">首过率（24h）</div></div>
    <div class="stat"><div class="n">${fmtPct(d.human_touch_rate_24h)}</div><div class="l">人工触达率</div></div>
    <div class="stat"><div class="n">${fmtSec(d.p95_node_seconds)}</div><div class="l">P95 节点耗时</div></div>
    <div class="stat"><div class="n">¥${d.cost_per_task_24h_cny.toFixed(3)}</div><div class="l">单任务成本</div></div>
  `;
  document.getElementById('queue').innerHTML=['A','B','C'].map(r=>`<div class="stat"><div class="n">${d.queue_depth[r]||0}</div><div class="l">${r} 域积压</div></div>`).join('');
  document.getElementById('errors').innerHTML=d.error_top_5.length?d.error_top_5.map(x=>`<div style="padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:13px;">${x.error_class} × ${x.count}</div>`).join(''):'<div class="muted">无失败记录</div>';
  document.getElementById('updated').textContent='更新于 '+new Date().toLocaleTimeString();
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
