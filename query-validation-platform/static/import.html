<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入 Query · 产能验证平台</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<div id="layout"></div>
<div class="content" style="max-width:760px;">
  <div class="card">
    <h2>批量导入查询词</h2>
    <label>生产模式</label>
    <select id="mode">
      <option value="general">通用（直接 AI 生图）</option>
      <option value="single">单品（实景图 → 生图）</option>
      <option value="compare">对比（实景图 → 生图）</option>
    </select>
    <div style="height:14px"></div>
    <label>Query 列表（每行一个）</label>
    <textarea id="queries" style="height:240px;" placeholder="拉萨市第八中学怎么样&#10;骆驼冷风机实测：值不值得买&#10;小米17 Pro 和 荣耀600 Pro 怎么选？"></textarea>
    <div class="muted" style="font-size:12px;margin-top:8px;">导入后系统自动生成：正文 + 证据 + 实景图 + 6 张配图</div>
    <div style="height:14px"></div>
    <button class="btn btn-primary" onclick="submit()">导入并启动</button>
    <div id="result"></div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
requireLogin();
renderLayout('import', '导入 Query');
async function submit(){
  const queries=document.getElementById('queries').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const mode=document.getElementById('mode').value;
  if(!queries.length){ alert('请至少输入一个 Query'); return; }
  const r=await fetch('/api/tasks/import_queries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({queries,mode})});
  const d=await r.json();
  document.getElementById('result').innerHTML=`<div class="card" style="background:#dcfce7;margin-top:14px;margin-bottom:0;">✅ 已导入 <b>${d.imported}</b> 个任务，系统正在后台生成内容。<a href="/progress">查看进度 →</a></div>`;
  document.getElementById('queries').value='';
}
</script>
</body>
</html>
