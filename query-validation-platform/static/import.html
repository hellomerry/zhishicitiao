<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入 Query · 产能验证平台</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e0e2e6; --text:#1a1d21; --muted:#6b7280; --blue:#2563eb; --green:#16a34a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:24px; max-width:800px; margin:0 auto; }
  h1 { font-size:20px; margin-bottom:16px; }
  .nav { margin-bottom:20px; } .nav a { color:var(--blue); margin-right:16px; text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
  textarea { width:100%; height:220px; padding:12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; resize:vertical; }
  select { padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  .btn { padding:10px 24px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .result { padding:12px; border-radius:8px; margin-top:12px; font-size:14px; }
  .result.ok { background:#dcfce7; color:var(--green); }
</style>
</head>
<body>
<h1>导入 Query</h1>
<div class="nav">
  <a href="/workbench">审核工作台</a>
  <a href="/progress">进度查看</a>
  <a href="/dashboard">产能看板</a>
</div>
<div class="card">
  <label>内容类型</label>
  <select id="ctype">
    <option value="generic">通用</option>
    <option value="school">学校/机构</option>
    <option value="product">产品评测</option>
    <option value="compare">对比</option>
  </select>
  <div style="height:12px"></div>
  <label>Query（每行一个）</label>
  <textarea id="queries" placeholder="拉萨市第八中学怎么样&#10;骆驼冷风机实测：值不值得买&#10;小米17 Pro 和 荣耀600 Pro 怎么选？"></textarea>
  <div class="hint">每行一个 Query，导入后系统自动跑流水线（生成正文 + 6 张图）</div>
  <div style="height:12px"></div>
  <button class="btn" onclick="submit()">导入并启动</button>
  <div id="result"></div>
</div>
<script>
async function submit(){
  const queries=document.getElementById('queries').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const content_type=document.getElementById('ctype').value;
  if(!queries.length){ alert('请至少输入一个 Query'); return; }
  const r=await fetch('/api/tasks/import_queries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({queries,content_type})});
  const d=await r.json();
  document.getElementById('result').innerHTML=`<div class="result ok">✅ 已导入 ${d.imported} 个任务，系统正在后台自动生成内容…</div>`;
  document.getElementById('queries').value='';
}
</script>
</body>
</html>
