<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 产能验证平台</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1f2430 0%,#2f6bff 100%); }
  .login-wrap { width:400px; }
  .login-card { background:#fff; border-radius:16px; padding:40px 36px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .login-card .logo { text-align:center; margin-bottom:8px; font-size:28px; }
  .login-card h1 { text-align:center; font-size:20px; margin-bottom:4px; }
  .login-card .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:28px; }
  .field { margin-bottom:16px; }
  .field label { font-size:13px; color:var(--muted); margin-bottom:6px; display:block; }
  .field input, .field select { width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  .field input:focus, .field select:focus { outline:2px solid var(--primary); border-color:transparent; }
  .login-btn { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .login-btn:hover { background:var(--primary-hover); }
  .toggle { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .toggle a { color:var(--primary); cursor:pointer; text-decoration:none; }
  .error { background:#fee2e2; color:var(--red); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none; }
  .role-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .role-opt { border:2px solid var(--border); border-radius:8px; padding:10px 6px; text-align:center; cursor:pointer; font-size:13px; }
  .role-opt.sel { border-color:var(--primary); background:#eff5ff; color:var(--primary); }
  .hint { background:#f0f7ff; border:1px solid #dbeafe; color:#1e40af; padding:10px 14px; border-radius:8px; font-size:12px; margin-bottom:16px; line-height:1.6; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">🏭</div>
    <h1>产能验证平台</h1>
    <div class="sub" id="subtitle">登录以开始工作</div>
    <div class="hint" id="hint">预设账号：张三 / 李四 / 王五<br>统一密码：12345678</div>
    <div class="error" id="error"></div>

    <!-- 登录模式 -->
    <div id="loginMode">
      <div class="field"><label>用户名</label><input id="loginName" placeholder="请输入用户名"></div>
      <div class="field"><label>密码</label><input id="loginPwd" type="password" placeholder="请输入密码"></div>
      <button class="login-btn" onclick="doLogin()">登 录</button>
      <div class="toggle">没有账号？<a onclick="showRegister()">注册</a></div>
    </div>

    <!-- 注册模式 -->
    <div id="registerMode" style="display:none;">
      <div class="field"><label>用户名</label><input id="regName" placeholder="请输入用户名"></div>
      <div class="field"><label>密码</label><input id="regPwd" type="password" placeholder="请输入密码"></div>
      <div class="field"><label>审核角色</label></div>
      <div class="role-grid" id="rolegrid">
        <div class="role-opt sel" data-role="A">A · 文案事实</div>
        <div class="role-opt" data-role="B">B · 图片版权</div>
        <div class="role-opt" data-role="C">C · 合规交付</div>
      </div>
      <button class="login-btn" onclick="doRegister()">注 册</button>
      <div class="toggle">已有账号？<a onclick="showLogin()">登录</a></div>
    </div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
let regRole='A';
document.getElementById('rolegrid').addEventListener('click',e=>{
  const o=e.target.closest('.role-opt'); if(!o) return;
  regRole=o.dataset.role;
  document.querySelectorAll('.role-opt').forEach(x=>x.classList.toggle('sel',x===o));
});
function showError(msg){ const e=document.getElementById('error'); e.textContent=msg; e.style.display='block'; }
function hideError(){ document.getElementById('error').style.display='none'; }
function showRegister(){ document.getElementById('loginMode').style.display='none'; document.getElementById('registerMode').style.display='block'; document.getElementById('subtitle').textContent='注册新账号'; document.getElementById('hint').style.display='none'; hideError(); }
function showLogin(){ document.getElementById('registerMode').style.display='none'; document.getElementById('loginMode').style.display='block'; document.getElementById('subtitle').textContent='登录以开始工作'; document.getElementById('hint').style.display='block'; hideError(); }
async function doLogin(){
  const username=document.getElementById('loginName').value.trim();
  const password=document.getElementById('loginPwd').value;
  if(!username||!password){ showError('请输入用户名和密码'); return; }
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const d=await r.json();
  if(!d.ok){ showError(d.error||'登录失败'); return; }
  setUser({name:d.name,role:d.role});
  location.href='/workbench';
}
async function doRegister(){
  const username=document.getElementById('regName').value.trim();
  const password=document.getElementById('regPwd').value;
  if(!username||!password){ showError('请输入用户名和密码'); return; }
  const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,role:regRole})});
  const d=await r.json();
  if(!d.ok){ showError(d.error||'注册失败'); return; }
  setUser({name:d.name,role:d.role});
  location.href='/workbench';
}
document.getElementById('loginPwd').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('regPwd').addEventListener('keydown',e=>{ if(e.key==='Enter') doRegister(); });
</script>
</body>
</html>
