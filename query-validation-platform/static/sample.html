<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机抽查 · 产能验证平台</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  .sample-body { max-width: 900px; }
  .sample-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .sample-head h2 { margin: 0; }
  .risk-badge { padding: 3px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .risk-green { background: #dcfce7; color: #16a34a; }
  .risk-yellow { background: #fef3c7; color: #d97706; }
  .risk-red { background: #fee2e2; color: #dc2626; }
  .draft-box { background: #fafbfc; border: 1px solid var(--border); border-radius: 8px; padding: 16px; white-space: pre-wrap; line-height: 1.7; font-size: 14px; max-height: 380px; overflow-y: auto; }
  .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .img-grid figure { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fafbfc; }
  .img-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .img-grid figcaption { padding: 6px 8px; font-size: 12px; color: var(--muted); }
  .ev-item { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .ev-item .url { color: var(--primary); word-break: break-all; }
  .section-title { font-size: 13px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
</style>
</head>
<body>
<div id="layout"></div>
<div class="content sample-body">
  <div class="card">
    <div class="sample-head">
      <h2>随机抽查</h2>
      <button class="btn btn-primary" onclick="load()">🎲 抽查一条</button>
    </div>
    <div class="muted" style="font-size:13px;">从已完成内容中随机抽取一条，核对正文、配图与证据是否合格。</div>
    <div id="result" style="margin-top:16px;"></div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
requireLogin();
renderLayout('sample', '随机抽查');

function riskBadge(level){
  const map={green:'risk-green',yellow:'risk-yellow',red:'risk-red'};
  return `<span class="risk-badge ${map[level]||''}">${level||'未分级'}</span>`;
}

async function load(){
  document.getElementById('result').innerHTML=`<div class="empty"><div class="icon">🎲</div>正在随机抽取…</div>`;
  try{
    const r=await fetch('/api/tasks/random_sample');
    const d=await r.json();
    if(!d.ok){ document.getElementById('result').innerHTML=`<div class="empty"><div class="icon">📭</div>${d.error||'暂无数据'}</div>`; return; }
    render(d);
  }catch(e){
    document.getElementById('result').innerHTML=`<div class="empty"><div class="icon">⚠️</div>加载失败：${e.message}</div>`;
  }
}

function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(d){
  const imgs=(d.assets||[]).map(a=>`<figure><img src="${esc(a.image_url||'')}" onerror="this.style.opacity='0.2'"><figcaption>第 ${a.page_index} 页 · ${a.source_type==='ai_generated'?'AI生成':a.source_type} · ${a.copyright_status||''}</figcaption></figure>`).join('');
  const evs=(d.evidences||[]).map(e=>`<div class="ev-item"><div class="url">${esc(e.source_url||'')}</div><div class="muted">${esc(e.excerpt||'')}</div></div>`).join('')||'<div class="muted">无证据</div>';
  const claims=(d.claims||[]).map(c=>`<div class="ev-item">[${esc(c.risk_level||'')}] ${esc(c.claim_text||'')}</div>`).join('')||'<div class="muted">无事实点</div>';

  document.getElementById('result').innerHTML=`
    <div class="sample-head" style="margin-bottom:6px;">
      <div style="flex:1;"><strong style="font-size:16px;">${esc(d.query||'')}</strong>
        <div class="muted" style="font-size:12px;margin-top:2px;">内容类型：${esc(d.content_type||'')} · 状态：${esc(d.status||'')}</div>
      </div>
      ${riskBadge(d.risk?.level)}
    </div>

    <div class="section-title">正文（${d.draft?.model_version||'—'}）</div>
    <div class="draft-box">${esc(d.draft?.body||'（无正文）')}</div>

    <div class="section-title">配图（${(d.assets||[]).length} 张）</div>
    <div class="img-grid">${imgs}</div>

    <div class="section-title">事实点</div>
    ${claims}

    <div class="section-title">证据来源</div>
    ${evs}

    ${d.risk?.reasons?.length?`<div class="section-title">风险原因</div><div class="muted">${esc(d.risk.reasons.join('；'))}</div>`:''}
  `;
}

load();
</script>
</body>
</html>
