<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进度查看 · 产能验证平台</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-title">进度查看 <button class="btn btn-outline" style="margin-left:auto;" onclick="load()">刷新</button></div>
  <div class="card">
    <h2>任务状态</h2>
    <div class="grid grid-4" id="status"></div>
  </div>
  <div class="card">
    <h2>流水线节点完成数</h2>
    <div id="nodes"></div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
requireLogin();
renderNav('progress');
const NODES=['task_import','entity_bind','evidence_build','draft_gen','rule_check','page_split','asset_gen','ocr_read','cross_check','risk_classify','review_queue','batch_signoff','publish_snapshot'];
const NODE_LABEL={task_import:'任务导入',entity_bind:'搜实景图',evidence_build:'证据+交叉验证',draft_gen:'正文生成',rule_check:'规则质检',page_split:'分页文案',asset_gen:'配图生成',ocr_read:'OCR回读',cross_check:'图文一致性',risk_classify:'风险分流',review_queue:'审核队列',batch_signoff:'批次会签',publish_snapshot:'发布快照'};
async function load(){
  const r=await fetch('/api/tasks/stats');
  const d=await r.json();
  const s=d.by_status||{};
  const total=d.total||0;
  const items=[['draft','草稿','tag-gray'],['processing','生产中','tag-blue'],['review','待审核','tag-yellow'],['failed','失败','tag-red'],['approved','已完成','tag-green']];
  document.getElementById('status').innerHTML=items.map(([k,label,cls])=>`<div class="stat"><div class="n ${cls.replace('tag-','')}">${s[k]||0}</div><div class="l">${label}</div></div>`).join('')+`<div class="stat"><div class="n">${total}</div><div class="l">总计</div></div>`;
  const nc=d.nodes_completed||{};
  const maxNode=Math.max(1,...Object.values(nc));
  document.getElementById('nodes').innerHTML=NODES.map(n=>{
    const c=nc[n]||0;
    const pct=Math.min(100,Math.round(c/maxNode*100));
    return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;">
      <div style="width:120px;font-size:13px;">${NODE_LABEL[n]||n}</div>
      <div style="flex:1;height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden;"><div style="height:100%;background:var(--primary);width:${pct}%"></div></div>
      <div style="width:50px;font-size:12px;color:var(--muted);text-align:right;">${c}</div>
    </div>`;
  }).join('');
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
