services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qvp
      POSTGRES_PASSWORD: qvp
      POSTGRES_DB: qvp
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "wal_level=replica"]
  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  pg_data:
  redis_data:
